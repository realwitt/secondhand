[workspace]
resolver = "2"
members = ["crates/lifeboat-core", "crates/lifeboat-cli", "tools/make-fixtures", "app/src-tauri"]
default-members = ["crates/lifeboat-core", "crates/lifeboat-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realwitt/lifeboat"
rust-version = "1.95"

[workspace.dependencies]
# The VectorCraft engine, pinned to the commit that adds FreeHand import
# (storytold/vectorcraft#2075). See README "Switching to upstream VectorCraft".
vectorcraft-engine = { git = "https://github.com/realwitt/vectorcraft", rev = "6db207b0b9b89eeb7a6865f1f4a1ff6ffac2e7c4" }
vectorcraft-freehand = { git = "https://github.com/realwitt/vectorcraft", rev = "6db207b0b9b89eeb7a6865f1f4a1ff6ffac2e7c4" }
vectorcraft-format = { git = "https://github.com/realwitt/vectorcraft", rev = "6db207b0b9b89eeb7a6865f1f4a1ff6ffac2e7c4" }
lifeboat-core = { path = "crates/lifeboat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
